name: CN Compile Test

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      DALAMUD_HOME: /tmp/dalamud
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud Latest
        run: |
          wget https://goatcorp.github.io/dalamud-distrib/latest.zip -O ${{ env.DALAMUD_HOME }}.zip
          unzip ${{ env.DALAMUD_HOME }}.zip -d ${{ env.DALAMUD_HOME }}

      - name: Restore Project
        run: dotnet restore

      - name: Build Project
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          echo "AssemblyVersion: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          dotnet build --configuration Release AutoDuty/AutoDuty.csproj -p:AssemblyVersion="$VERSION"

      - name: Print Release Body
        run: |
          echo "${{ github.event.release.body }} AssemblyVersion=${{ env.VERSION }}"

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AutoDuty 汉化版 ${{ env.VERSION }}
          body: "AutoDuty 国服汉化版 ${{ env.VERSION }}（基于上游 ${{ env.VERSION }}，tag ${{ github.ref_name }}）"
          files: AutoDuty/bin/Release/AutoDuty/latest.zip
